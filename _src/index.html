    <style>
      :root {
        --bg: #07080b; --bg2: #0b0d12; --card: #0f1117; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.15);
        --tx: #f3f4f6; --mu: #a0a6b0; --mu2: #6c727c;
        --a1: #ff5b35; --a2: #ff9a3c; --a3: #b05cff; --a4: #4f7cff;
        --grad: linear-gradient(100deg, var(--a1), var(--a2) 32%, var(--a3) 68%, var(--a4));
        --lt: #f6f8fb; --ltx: #0a2540; --lmu: #4b5b70; --lline: #e2e7ee;
        --ok: #3ddc84;
        --amp: 1;
        --ease: cubic-bezier(.2,.7,.1,1);
      }
      @media (prefers-reduced-motion: reduce) { :root { --amp: .35; } }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
      body { background: var(--bg); color: var(--tx); font: 400 17px/1.6 "Inter", system-ui, sans-serif;
             -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      a { color: inherit; text-decoration: none; }
      img, svg { display: block; max-width: 100%; }
      button, input, textarea { font: inherit; color: inherit; }
      .wrap { max-width: 1200px; margin: 0 auto; padding: 0 32px; }
      h1, h2, h3 { font-family: "Inter Tight", "Inter", sans-serif; font-weight: 600; letter-spacing: -.025em; }
      .gt { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

      /* ── üst çubuk ── */
      .top { position: fixed; inset: 0 0 auto; z-index: 50; height: 68px; transition: background .3s, border-color .3s, color .3s;
             border-bottom: 1px solid transparent; }
      .top.sc { background: rgba(7,8,11,.72); backdrop-filter: saturate(160%) blur(14px); -webkit-backdrop-filter: saturate(160%) blur(14px);
                border-color: var(--line); }
      .top.lt { background: rgba(246,248,251,.8); color: var(--ltx); border-color: var(--lline); }
      .top .wrap { height: 100%; display: flex; align-items: center; gap: 28px; }
      .mark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
      .mark i { width: 26px; height: 26px; border-radius: 8px; background: var(--grad); display: grid; place-items: center;
                font: 700 12px "Inter Tight"; color: #fff; font-style: normal; }
      .links { display: flex; gap: 24px; margin-left: auto; font-size: 14.5px; color: var(--mu); }
      .top.lt .links { color: var(--lmu); }
      .links a { transition: color .2s; }
      .links a:hover { color: currentColor; filter: brightness(1.6); }
      .lang { font: 500 13px "IBM Plex Mono"; color: var(--mu); border: 1px solid var(--line2); border-radius: 99px; padding: 5px 11px;
              background: none; cursor: pointer; }
      .top.lt .lang { color: var(--lmu); border-color: var(--lline); }
      .pill { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 18px; border-radius: 99px;
              background: #fff; color: #07080b; font-weight: 600; font-size: 14.5px; transition: transform .25s var(--ease), box-shadow .3s; }
      .top.lt .pill { background: var(--ltx); color: #fff; }
      .pill:hover { box-shadow: 0 8px 30px -8px rgba(255,120,70,.6); }
      .pill svg { width: 15px; height: 15px; }

      .skip { position: absolute; left: -9999px; top: 0; z-index: 99; background: #fff; color: #07080b; padding: 10px 16px; border-radius: 0 0 10px 0; font-weight: 600; }
      .skip:focus { left: 0; }
      .links a[href="#iletisim"] { display: none; }
      main section[id] { scroll-margin-top: 56px; }
      .links a.on { color: currentColor; filter: brightness(1.6); }
      .menu { display: none; width: 38px; height: 38px; border-radius: 99px; border: 1px solid var(--line2); background: none; cursor: pointer; place-items: center; color: inherit; }
      .menu svg { width: 18px; height: 18px; }
      .top.lt .menu { border-color: var(--lline); }
      :focus-visible { outline: 2px solid var(--a2); outline-offset: 3px; border-radius: 6px; }

      /* ── giriş ── */
      .hero { position: relative; min-height: 100vh; min-height: 100svh; padding: 130px 0 80px; display: flex; align-items: center; overflow: hidden; isolation: isolate; }
      .aurora { position: absolute; inset: -20% -10% auto; height: 120%; z-index: -1; pointer-events: none; }
      .aurora b { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
      .aurora .b1 { width: 620px; height: 460px; right: 4%; top: 6%; background: radial-gradient(closest-side, var(--a1), transparent); animation: drift1 18s ease-in-out infinite alternate; }
      .aurora .b2 { width: 560px; height: 520px; right: 22%; top: 26%; background: radial-gradient(closest-side, var(--a3), transparent); opacity: .38; animation: drift2 22s ease-in-out infinite alternate; }
      .aurora .b3 { width: 480px; height: 420px; right: -6%; top: 40%; background: radial-gradient(closest-side, var(--a4), transparent); opacity: .32; animation: drift1 26s ease-in-out infinite alternate-reverse; }
      @keyframes drift1 { to { transform: translate(calc(-60px * var(--amp)), calc(40px * var(--amp))) scale(1.08); } }
      @keyframes drift2 { to { transform: translate(calc(70px * var(--amp)), calc(-30px * var(--amp))) scale(.94); } }
      .grid-bg { position: absolute; inset: 0; z-index: -1; pointer-events: none;
                 background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
                 background-size: 64px 64px; opacity: .45;
                 -webkit-mask-image: radial-gradient(ellipse 70% 60% at 70% 40%, #000 10%, transparent 70%);
                 mask-image: radial-gradient(ellipse 70% 60% at 70% 40%, #000 10%, transparent 70%); }
      .hero .wrap { width: 100%; display: grid; grid-template-columns: 1fr 1.08fr; gap: 40px; align-items: center; }
      .avail { display: inline-flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--mu); border: 1px solid var(--line2);
               border-radius: 99px; padding: 6px 14px 6px 11px; background: rgba(255,255,255,.03); }
      .avail i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: ping 2.2s infinite; }
      @keyframes ping { 70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
      .hero h1 { margin-top: 26px; font-size: clamp(34px, 4.4vw, 58px); line-height: 1.06; max-width: 15ch; }
      .hero .lede { margin-top: 22px; font-size: 18px; color: var(--mu); max-width: 520px; }
      .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
      .btn { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 24px; border-radius: 99px; font-weight: 600;
             font-size: 15.5px; transition: transform .25s var(--ease), background .25s, box-shadow .3s; will-change: transform; }
      .btn svg { width: 18px; height: 18px; }
      .btn.pri { background: #fff; color: #07080b; }
      .btn.pri:hover { box-shadow: 0 10px 40px -10px rgba(255,130,70,.7); }
      .btn.gh { border: 1px solid var(--line2); color: var(--tx); background: rgba(255,255,255,.02); }
      .btn.gh:hover { background: rgba(255,255,255,.07); }
      .stage { position: relative; --mx: 0; --my: 0; }
      .stage svg { width: 100%; height: auto; overflow: visible; }
      .stage .L1 { transform: translate(calc(var(--mx) * -10px), calc(var(--my) * -8px)); transition: transform .5s var(--ease); }
      .stage .L2 { transform: translate(calc(var(--mx) * 16px), calc(var(--my) * 12px)); transition: transform .5s var(--ease); }
      .stage .L3 { transform: translate(calc(var(--mx) * 8px), calc(var(--my) * 18px)); transition: transform .5s var(--ease); }
      .hero-vis { transform-origin: 50% 100%; transition: transform .1s linear, opacity .1s linear; }

      /* ── sahne çizim dili (bütün çizimler bunu kullanır) ── */
      .s-fr { fill: #0e1016; stroke: rgba(255,255,255,.13); }
      .s-in { fill: rgba(255,255,255,.025); }
      .s-bar { fill: rgba(255,255,255,.05); }
      .s-sk { fill: rgba(255,255,255,.1); }
      .s-sk2 { fill: rgba(255,255,255,.18); }
      .s-hl { fill: url(#gA); }
      .s-hlbg { fill: url(#gA); opacity: .22; }
      .s-ln { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 1.5; }
      .s-gl { fill: none; stroke: url(#gA); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 5px rgba(255,120,60,.55)); }
      .s-wh { fill: none; stroke: rgba(255,255,255,.75); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .s-dot { fill: #fff; filter: drop-shadow(0 0 6px #ff8a4c) drop-shadow(0 0 2px #fff); }
      .s-ok { fill: rgba(61,220,132,.75); }
      .s-paper { fill: #fbfaf5; }
      .s-ink { fill: #c9c5b8; }
      .s-ink2 { fill: #26241d; }
      .s-dev { fill: url(#gDev); stroke: rgba(255,255,255,.12); }
      .sc .g, .sc .w, .sc .f, .sc .d, .sc .up { transition: transform .9s var(--ease), opacity .7s var(--ease), stroke-dashoffset 1.4s var(--ease), fill .6s;
                transition-delay: calc(var(--i, 0) * 70ms); }
      .sc .g { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(.06); }
      .sc .w { transform-box: fill-box; transform-origin: 0 50%; transform: scaleX(.04); }
      .sc .f { opacity: 0; transform: translateY(calc(12px * var(--amp))); }
      .sc .d { stroke-dasharray: 1; stroke-dashoffset: 1; }
      .sc .up { transform: translateY(var(--h, 160px)); transition-duration: 2.2s; }
      .sc.on .g, .sc.on .w { transform: none; }
      .sc.on .f { opacity: 1; transform: none; }
      .sc.on .d { stroke-dashoffset: 0; }
      .sc.on .up { transform: none; }
      .sc .amber { fill: rgba(255,180,60,.85); transition: fill .6s 1.6s; }
      .sc.on .amber { fill: rgba(61,220,132,.75); }
      .blink { animation: blink 3.2s ease-in-out infinite; }
      @keyframes blink { 0%, 100% { opacity: .22; } 50% { opacity: .65; } }
      .bob { animation: bob 5s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(calc(-8px * var(--amp))); } }
      .scan { animation: scan 2.6s ease-in-out infinite alternate; }
      @keyframes scan { from { transform: translateY(0); } to { transform: translateY(72px); } }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(1.18); opacity: .6; } }

      /* giriş döngüsü: telefonda sipariş → panelde görünür → yazıcı basar */
      .hCard { animation: hCard 7s var(--ease) infinite; }
      .hRow { animation: hRow 7s var(--ease) infinite; }
      .hGlow { animation: hGlow 7s ease infinite; }
      .hPaper { animation: hPaper 7s var(--ease) infinite; }
      .hPress { transform-box: fill-box; transform-origin: center; animation: hPress 7s ease infinite; }
      @keyframes hCard { 0%, 8% { opacity: 0; transform: translateY(-10px); } 14%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
      @keyframes hRow { 0%, 28% { opacity: 0; transform: translateX(-12px); } 34%, 90% { opacity: 1; transform: none; } 97%, 100% { opacity: 0; } }
      @keyframes hGlow { 0%, 29% { opacity: 0; } 36% { opacity: 1; } 62%, 100% { opacity: 0; } }
      @keyframes hPaper { 0%, 46% { transform: translateY(158px); opacity: 1; } 72%, 91% { transform: none; opacity: 1; } 98%, 100% { transform: none; opacity: 0; } }
      @keyframes hPress { 0%, 2% { transform: none; } 5% { transform: scale(.82); } 8%, 100% { transform: none; } }

      /* ── bölüm başlıkları ── */
      section { position: relative; }
      .sec { padding: 140px 0; }
      .eb { display: inline-block; font: 500 13px "IBM Plex Mono", monospace; letter-spacing: .04em; margin-bottom: 18px; }
      .h2 { font-size: clamp(30px, 3.4vw, 46px); line-height: 1.1; max-width: 18ch; }
      .sl { margin-top: 18px; font-size: 18px; color: var(--mu); max-width: 560px; }
      .light { background: var(--lt); color: var(--ltx); }
      .light .sl, .light p { color: var(--lmu); }
      .rv { opacity: 0; transform: translateY(calc(26px * var(--amp))); transition: opacity .9s var(--ease), transform .9s var(--ease); transition-delay: var(--dl, 0s); }
      .rv.in { opacity: 1; transform: none; }

      /* ── güven şeridi ── */
      .trust { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg2); }
      .trust .wrap { display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; padding-top: 44px; padding-bottom: 44px; align-items: center; }
      .tlab { font: 500 12.5px "IBM Plex Mono"; color: var(--mu2); letter-spacing: .05em; }
      .names { display: flex; flex-wrap: wrap; gap: 14px 36px; margin-top: 16px; }
      .names span { font: 600 21px "Inter Tight"; letter-spacing: -.02em; color: #7d838d; transition: color .3s; }
      .names span:hover { color: #fff; }
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
      .stat b { display: block; font: 600 34px/1.1 "Inter Tight"; letter-spacing: -.03em; }
      .stat span { display: block; margin-top: 6px; font-size: 13.5px; color: var(--mu); line-height: 1.35; }

      /* ── hizmetler: sabit sahne, kayan anlatım ── */
      .svc .head { margin-bottom: 40px; }
      .svc-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 72px; }
      .step { min-height: 56vh; display: flex; flex-direction: column; justify-content: center; opacity: .3; transition: opacity .5s; }
      .step.act { opacity: 1; }
      .step .n { font: 500 13px "IBM Plex Mono"; color: var(--mu2); }
      .step h3 { margin-top: 10px; font-size: clamp(22px, 2vw, 28px); line-height: 1.2; }
      .step p { margin-top: 12px; color: var(--mu); max-width: 440px; }
      .step .inl { display: none; }
      .stage-col { position: sticky; top: calc(50vh - 230px); height: 460px; align-self: start; margin-top: 12vh; }
      .frame { position: relative; height: 100%; border-radius: 24px; border: 1px solid var(--line); overflow: hidden;
               background: radial-gradient(120% 90% at 70% 0%, rgba(255,110,60,.13), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(80,110,255,.12), transparent 60%), var(--bg2); }
      .frame .sc { position: absolute; inset: 40px; opacity: 0; transform: scale(.97); transition: opacity .6s var(--ease), transform .8s var(--ease); }
      .frame .sc.on { opacity: 1; transform: none; }
      .frame .sc svg { width: 100%; height: 100%; }
      .counter { position: absolute; left: 24px; bottom: 20px; font: 500 12.5px "IBM Plex Mono"; color: var(--mu2); display: flex; align-items: center; gap: 12px; z-index: 2; }
      .counter u { display: block; width: 120px; height: 2px; background: var(--line2); text-decoration: none; position: relative; overflow: hidden; border-radius: 2px; }
      .counter u i { position: absolute; inset: 0; background: var(--grad); transform-origin: 0 50%; transform: scaleX(0); transition: transform .5s var(--ease); }

      /* ── işler ── */
      .work { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; margin-top: 60px; }
      .card { position: relative; border-radius: 22px; background: var(--card); border: 1px solid var(--line); overflow: hidden;
              transition: transform .5s var(--ease), border-color .3s; --x: 50%; --y: 0%; }
      .card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 2;
                      background: radial-gradient(380px circle at var(--x) var(--y), rgba(255,140,80,.7), transparent 45%);
                      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
                      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: 0; transition: opacity .3s; }
      .card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
                     background: radial-gradient(500px circle at var(--x) var(--y), rgba(255,255,255,.045), transparent 50%); opacity: 0; transition: opacity .3s; }
      .card:hover::before, .card:hover::after { opacity: 1; }
      .card .vis { aspect-ratio: 5 / 3; border-bottom: 1px solid var(--line);
                   background: radial-gradient(90% 100% at 50% 0%, rgba(255,120,70,.1), transparent 60%), #0b0d12; padding: 22px; }
      .card .vis svg { width: 100%; height: 100%; }
      .card .tx { padding: 26px 28px 30px; }
      .card .k { font: 500 12.5px "IBM Plex Mono"; color: var(--mu2); }
      .card h3 { margin-top: 8px; font-size: 23px; line-height: 1.2; }
      .card p { margin-top: 10px; color: var(--mu); font-size: 15.5px; }
      .card .go { display: inline-flex; align-items: center; gap: 7px; margin-top: 18px; font-weight: 600; font-size: 14.5px; }
      .card .go svg { width: 15px; height: 15px; transition: transform .3s var(--ease); }
      .card:hover .go svg { transform: translate(2px, -2px); }
      .card a.cover { position: absolute; inset: 0; z-index: 3; }
      .card .gos { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 18px; }
      .card .gos .go { position: relative; z-index: 4; padding: 8px 0; margin: -8px 0; }
      .card .gos .go:hover { color: var(--a2); }

      /* ── fiş ── */
      .fis { height: 230vh; }
      .fis-in { position: sticky; top: 0; height: 100vh; }
      .fis-in .wrap { height: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: center; }
      .fis .eb { color: var(--a1); }
      .note p { margin-top: 18px; font-size: 17.5px; max-width: 480px; }
      .note p:first-child { margin-top: 26px; }
      .note .proof { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--lline); font-size: 15px; }
      .note .proof a { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ltx); white-space: nowrap; }
      .note .proof svg { width: 14px; height: 14px; }
      .desk { position: relative; height: 100%; }
      .prn { position: absolute; left: 50%; bottom: 56px; width: min(330px, 100%); height: 118px; transform: translateX(-50%); z-index: 2;
             border-radius: 20px 20px 26px 26px; background: linear-gradient(180deg, #2a2d36, #121419 60%, #0b0c10);
             box-shadow: 0 40px 60px -30px rgba(10,37,64,.55), inset 0 1px 0 rgba(255,255,255,.12); }
      .prn::before { content: ""; position: absolute; left: 24px; right: 24px; top: 18px; height: 9px; border-radius: 5px; background: #000;
                     box-shadow: inset 0 2px 3px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); }
      .prn::after { content: ""; position: absolute; right: 26px; bottom: 22px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
                    box-shadow: 0 0 10px var(--ok); }
      .prn b { position: absolute; left: 26px; bottom: 19px; font: 500 11px "IBM Plex Mono"; color: rgba(255,255,255,.4); letter-spacing: .1em; }
      .paper { position: absolute; left: 50%; bottom: 152px; width: 284px; margin-left: -142px; height: 0; overflow: hidden; z-index: 3; }
      .paper .rc { position: absolute; left: 0; top: 7px; width: 284px; transform-origin: 0 0; background: #fffdf7; color: #17160f;
                   padding: 26px 24px 30px; font: 400 13px/1.62 "IBM Plex Mono", monospace; box-shadow: 0 1px 0 #ece8dc inset; }

            return '<div class="job rv"><span class="p">' + esc(t(e.period)) + "</span><div><h3>" + esc(t(e.title)) + "<small>" + esc(e.company) + "</small></h3></div><p>" + esc(t(e.description)) + "</p></div>";
          }).join("");
          $("eduT").textContent = U("educationTitle");
          $("edu").innerHTML = D("education").map(function (e) {
            return "<li>" + esc(t(e.degree)) + "<span>" + esc(e.school) + " · " + esc(e.period) + "</span></li>";
          }).join("");
          $("certT").textContent = U("certsTitle");
          $("certs").innerHTML = D("certificates").map(function (c) {
            return "<li>" + esc(t(c.name)) + "<span>" + esc(c.issuer) + " · " + esc(c.year) + "</span></li>";
          }).join("");
          $("skillT").textContent = U("skillsTitle");
          $("skills").innerHTML = D("skills").map(function (x) { return "<span>" + esc(x.name) + "</span>"; }).join("");
        }

        function renderContact() {
          var c = S.data.contact || {}, p = S.data.personal || {};
          var items = [[U("waLabel"), U("waButton"), waLink()], [U("email"), c.email, "mailto:" + c.email], [U("phone"), c.phone, "tel:" + String(c.phone).replace(/[^+\d]/g, "")]];
          D("social").forEach(function (s) { items.push([s.name, s.url.replace(/^https?:\/\/(www\.)?/, ""), s.url]); });
          items.push([U("cv"), S.lang.toUpperCase() + " · PDF", t(p.cv)]);
          $("rows").innerHTML = items.map(function (i) {
            return '<a class="row" href="' + esc(i[2]) + '"' + (/^https?:/.test(i[2]) ? ' target="_blank" rel="noopener"' : "") + "><span>" + esc(i[0]) + "</span><b>" + esc(i[1]) + "</b>" + arrowOut + "</a>";
          }).join("");
          $("lName").textContent = U("formName"); $("lEmail").textContent = U("formEmail"); $("lMsg").textContent = U("formMessage");
          $("send").innerHTML = esc(U("formSend")) + arrowR;
          var m = S.data.meta || {};
          $("foot").innerHTML = "<span>© " + new Date().getFullYear() + " " + esc(p.name) + "</span><span>" + esc(t(c.location)) + "</span>" +
            (m.repo ? '<a href="' + esc(m.repo) + '" target="_blank" rel="noopener">GitHub</a>' : "");
        }

        function renderMeta() {
          var m = S.data.meta || {}, p = S.data.personal || {};
          var title = fill(t(m.title)), desc = fill(t(m.description));
          document.documentElement.lang = S.lang;
          document.title = title;
          var set = function (sel, attr, val) {
            var el = document.querySelector(sel); if (el) el.setAttribute(attr, val);
          };
          set('meta[name="description"]', "content", desc);
          set('meta[property="og:title"]', "content", title);
          set('meta[property="og:description"]', "content", desc);
          set('meta[name="twitter:title"]', "content", title);
          set('meta[name="twitter:description"]', "content", desc);
          set('meta[property="og:locale"]', "content", S.lang === "tr" ? "tr_TR" : "en_US");
          set('meta[property="og:locale:alternate"]', "content", S.lang === "tr" ? "en_US" : "tr_TR");
          set('meta[property="og:url"]', "content", m.siteUrl + (S.lang === "en" ? "?lang=en" : ""));
          set('link[rel="canonical"]', "href", m.siteUrl + (S.lang === "en" ? "?lang=en" : ""));
          set('meta[property="og:image:alt"]', "content", t(m.imageAlt));
          set('meta[name="twitter:image:alt"]', "content", t(m.imageAlt));
        }

        function renderJsonLd() {
          var m = S.data.meta || {}, p = S.data.personal || {}, c = S.data.contact || {}, st = STAT();
          var site = m.siteUrl || "https://beratarpa.com/";
          var orgs = {}; D("experience").forEach(function (e) { if (e.company) orgs[e.company] = 1; });
          var g = [
            { "@type": "WebSite", "@id": site + "#site", url: site, name: t(m.siteName),
              inLanguage: S.lang === "tr" ? "tr-TR" : "en-US",
              publisher: { "@id": site + "#me" } },
            { "@type": "ProfilePage", "@id": site + "#page", url: site, name: fill(t(m.title)),
              isPartOf: { "@id": site + "#site" }, about: { "@id": site + "#me" },
              inLanguage: S.lang === "tr" ? "tr-TR" : "en-US" },
            { "@type": "Person", "@id": site + "#me", name: p.name, jobTitle: t(p.title),
              description: fill(t(m.description)), url: site,
              image: site + (p.image || "").replace(/^\//, ""),
              email: "mailto:" + c.email, telephone: c.phone,
              address: { "@type": "PostalAddress", addressLocality: t(m.baseCity), addressCountry: "TR" },
              sameAs: D("social").map(function (s) { return s.url; }),
              knowsAbout: D("skills").map(function (s) { return s.name; }),
              alumniOf: D("education").map(function (e) { return { "@type": "CollegeOrUniversity", name: e.school }; }),
              worksFor: Object.keys(orgs).map(function (o) { return { "@type": "Organization", name: o }; }) }
          ];
          D("projects").forEach(function (pr, i) {
            var x = L2(pr);
            g.push({ "@type": "SoftwareApplication", "@id": site + "#p" + i, name: x[0],
                     applicationCategory: "BusinessApplication", description: x[2],
                     operatingSystem: "Web", url: pr.url || site,
                     author: { "@id": site + "#me" } });
          });
          /* serbest çalışan olarak verdiği hizmet: yerel aramalarda (Ankara, yazılım) görünmesi için */
          g.push({ "@type": "ProfessionalService", "@id": site + "#biz", name: fill(t(m.title)).split(" | ")[0],
                   description: fill(t(m.description)), url: site, image: site + "Resources/Images/og-card.png",
                   email: "mailto:" + c.email, telephone: c.phone,
                   address: { "@type": "PostalAddress", addressLocality: t(m.baseCity), addressCountry: "TR" },
                   areaServed: { "@type": "Country", name: "Türkiye" },
                   founder: { "@id": site + "#me" }, sameAs: D("social").map(function (s) { return s.url; }) });
          D("services").forEach(function (s, i) {
            var x = L2(s);
            g.push({ "@type": "Service", "@id": site + "#s" + i, name: x[0], description: x[1],
                     provider: { "@id": site + "#biz" }, areaServed: "TR" });
          });
          $("ldjson").textContent = JSON.stringify({ "@context": "https://schema.org", "@graph": g });
        }

        function renderAll() {
          document.documentElement.lang = S.lang;
          renderTop(); heroStage(); heads(); renderTrust(); renderServices(); renderWork();
          renderReceipt(); renderProcess(); renderOpen(); renderJobs(); renderContact();
          renderMeta(); renderJsonLd();
          bindHover();
          update();
          setTimeout(update, 300);
        }

        /* ── kaydırma ─────────────────────────────────────────────── */
        function update() {
          if (!S.data) return;
          var vh = window.innerHeight, y = window.scrollY;
          var nav = $("top");
          nav.classList.toggle("sc", y > 8);
          var onLight = false, lights = document.querySelectorAll(".light");
          for (var i = 0; i < lights.length; i++) { var r = lights[i].getBoundingClientRect(); if (r.top <= 34 && r.bottom > 34) onLight = true; }
          nav.classList.toggle("lt", onLight);

          var rv = document.querySelectorAll(".rv:not(.in)");
          for (var j = 0; j < rv.length; j++) if (rv[j].getBoundingClientRect().top < vh * .9) rv[j].classList.add("in");

          /* üst çubukta okunan bölüm işaretlenir */
          var cur = "", secs = document.querySelectorAll("main section[id]");
          for (var c = 0; c < secs.length; c++) if (secs[c].getBoundingClientRect().top <= vh * .34) cur = secs[c].id;
          var la = $("links").querySelectorAll("a");
          for (var l = 0; l < la.length; l++) la[l].classList.toggle("on", la[l].getAttribute("href") === "#" + cur);

          /* giriş sahnesi aşağı inerken hafifçe geri yatar (Apple) */
          var hv = $("heroVis"), hp = clamp(y / (vh * .9), 0, 1);
          hv.style.transform = "perspective(1200px) rotateX(" + (hp * 14 * getAmp()).toFixed(2) + "deg) translateY(" + (hp * 40).toFixed(1) + "px) scale(" + (1 - hp * .06).toFixed(3) + ")";
          hv.style.opacity = (1 - hp * .7).toFixed(3);

          /* proje ve hizmet çizimleri görünür olunca açılır */
          var scs = document.querySelectorAll(".card .sc, .step .inl");
          for (var k = 0; k < scs.length; k++) { var b = scs[k].getBoundingClientRect(); if (b.top < vh * .82 && b.bottom > 0) scs[k].classList.add("on"); }

          /* hizmetler: ekranın ortasına en yakın adım sahneyi seçer */
          var steps = document.querySelectorAll(".step"), act = 0, best = 1e9;
          for (var s = 0; s < steps.length; s++) { var sr = steps[s].getBoundingClientRect(), dd = Math.abs(sr.top + sr.height / 2 - vh / 2); if (dd < best) { best = dd; act = s; } }
          if (act !== S.svcAct) {
            S.svcAct = act;
            for (var a = 0; a < steps.length; a++) steps[a].classList.toggle("act", a === act);
            var fr = document.querySelectorAll("#svcFrame .sc");
            for (var f = 0; f < fr.length; f++) fr[f].classList.toggle("on", +fr[f].getAttribute("data-i") === act);
            $("svcN").textContent = (act < 9 ? "0" : "") + (act + 1) + " / " + (steps.length < 10 ? "0" : "") + steps.length;
            $("svcBar").style.transform = "scaleX(" + ((act + 1) / steps.length) + ")";
          }

          /* rakamlar bir kez sayar */
          if (!S.counted) { var st = $("stats").getBoundingClientRect(); if (st.top < vh * .9) { S.counted = true; countUp(); } }

          /* fiş: yazıcıdan yukarı doğru basılır */
          var p;
          if (PIN.matches) { var fs = $("ozet").getBoundingClientRect(); p = clamp(-fs.top / (fs.height - vh) * 1.15, 0, 1); }
          else { var dk = $("desk").getBoundingClientRect(); p = clamp((vh * .95 - dk.top) / (dk.height * .85), 0, 1); }
          $("paper").style.height = ((S.rH || 0) * (1 - Math.pow(1 - p, 2))).toFixed(1) + "px";

          /* süreç çizgisi */
          var pr = $("proc").getBoundingClientRect(), pp = clamp((vh * .75 - pr.top) / (pr.height * .9), 0, 1);
          var ti = $("trackI");
          if (ti) ti.style.transform = (window.innerWidth <= 900 ? "scaleY(" : "scaleX(") + pp.toFixed(3) + ")";
          var ps = document.querySelectorAll(".ps");
          for (var n = 0; n < ps.length; n++) ps[n].classList.toggle("lit", pp >= n / Math.max(1, ps.length - 1) - .02 && pp > 0);
        }
        function getAmp() { return window.matchMedia("(prefers-reduced-motion: reduce)").matches ? .35 : 1; }

        /* ── etkileşim: mıknatıslı düğmeler, imleç etiketi, ışık takibi, paralaks ── */
        var cur = $("cur");
        function bindHover() {
          var mags = document.querySelectorAll(".mag");
          for (var i = 0; i < mags.length; i++) {
            if (mags[i]._b) continue; mags[i]._b = 1;
            mags[i].addEventListener("mousemove", function (e) {
              var r = this.getBoundingClientRect();
              this.style.transform = "translate(" + ((e.clientX - r.left - r.width / 2) * .22).toFixed(1) + "px," + ((e.clientY - r.top - r.height / 2) * .3).toFixed(1) + "px)";
            });
            mags[i].addEventListener("mouseleave", function () { this.style.transform = ""; });
          }
          var cards = document.querySelectorAll(".card");
          for (var j = 0; j < cards.length; j++) {
            cards[j].addEventListener("mousemove", function (e) {
              var r = this.getBoundingClientRect();
              this.style.setProperty("--x", (e.clientX - r.left) + "px"); this.style.setProperty("--y", (e.clientY - r.top) + "px");
            });
          }
        }
        document.addEventListener("mousemove", function (e) {
          cur.style.setProperty("--cx", e.clientX + "px"); cur.style.setProperty("--cy", e.clientY + "px");
          var c = e.target.closest && e.target.closest("[data-cur]");
          if (c) { cur.textContent = c.getAttribute("data-cur"); cur.classList.add("on"); } else cur.classList.remove("on");
          var st = $("stage");
          if (st && window.scrollY < window.innerHeight) {
            st.style.setProperty("--mx", ((e.clientX / window.innerWidth - .5) * 2 * getAmp()).toFixed(3));
            st.style.setProperty("--my", ((e.clientY / window.innerHeight - .5) * 2 * getAmp()).toFixed(3));
          }
        }, { passive: true });

        window.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", function () { S.svcAct = -1; layoutReceipt(); update(); });
        $("lang").addEventListener("click", function () {
          if (!S.data) return;
          S.lang = S.lang === "tr" ? "en" : "tr";
          try { localStorage.setItem("lang", S.lang); } catch (e) {}
          try { history.replaceState(null, "", "?lang=" + S.lang + location.hash); } catch (e) {}
          renderAll();
          var all = document.querySelectorAll(".rv"); for (var i = 0; i < all.length; i++) all[i].classList.add("in");
        });

        /* dar ekranda menü */
        $("menuBtn").addEventListener("click", function () {
          var o = $("top").classList.toggle("open");
          this.setAttribute("aria-expanded", o ? "true" : "false");
        });
        $("links").addEventListener("click", function (e) {
          if (e.target.closest("a")) { $("top").classList.remove("open"); $("menuBtn").setAttribute("aria-expanded", "false"); }
        });

        /* form: EmailJS üzerinden doğrudan e-postama gelir */
        $("form").addEventListener("submit", function (e) {
          e.preventDefault();
          var f = e.target, b = $("send"), m = $("msg");
          m.className = "msg"; m.textContent = "";
          if (!f.name.value.trim() || !f.email.value.trim() || !f.message.value.trim()) {
            m.className = "msg err"; m.textContent = U("formEmpty"); return;
          }
          if (typeof emailjs === "undefined") { m.className = "msg err"; m.textContent = fill(U("formErr")); return; }
          b.disabled = true; b.textContent = U("formSending");
          emailjs.init({ publicKey: "Fo7vBbMCWdic4Sge_" });
          emailjs.sendForm("service_yw336er", "template_ugvsp1h", f).then(function () {
            f.reset(); b.disabled = false; b.innerHTML = esc(U("formSend")) + arrowR;
            m.textContent = U("formOk");
          }, function () {
            b.disabled = false; b.innerHTML = esc(U("formSend")) + arrowR;
            m.className = "msg err"; m.textContent = fill(U("formErr"));
          });
        });

        fetch("data.json").then(function (r) { return r.json(); }).then(function (d) {
          S.data = d; renderAll();
          if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutReceipt);
          return fetch("https://api.github.com/users/BeratARPA/repos?per_page=100&sort=updated");
        }).then(function (r) { return r && r.ok ? r.json() : []; }).then(function (list) {
          S.repos = (list || []).filter(function (r) { return !r.fork; });
          if (!S.data) return;
          var b = $("stStars"); if (b) { b.setAttribute("data-to", STAT().stars); if (S.counted) b.textContent = num(STAT().stars); }
          renderOpen(); renderReceipt(); renderJsonLd();
        }).catch(function (e) { if (window.console) console.error(e); });
      })();
    </script>
  </body>
</html>
